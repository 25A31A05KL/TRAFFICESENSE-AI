services:
  mysql:
    image: mysql:8.4
    container_name: trafficsense-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: trafficsense
    ports:
      - "3306:3306"
    volumes:
      - trafficsense_db:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
volumes:
  trafficsense_db:
